<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge AI - Smart Cooking Assistant</title>
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            background: var(--white);
            padding: 4rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .hero:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--white);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #219150;
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
            transform: scale(1.05);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
            width: 100%;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Welcome to Fridge AI 🥗</h1>
        <p>Your intelligent kitchen companion. Snap a photo of your ingredients and let AI craft the perfect recipes for
            you.</p>

        <a href="{% url 'cooking_suggestion' %}" class="btn">Get Started</a>

        <div class="features">
            <div class="feature-item">📸 Photo Recognition</div>
            <div class="feature-item">🍳 Smart Recipes</div>
            <div class="feature-item">🥕 Ingredient Analysis</div>
        </div>
    </div>

</body>

</html>
